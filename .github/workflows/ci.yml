name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Linux checks and Debian bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf

      - name: Select stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The checked-in frontend lock requires Node 18 or newer; use the
          # current LTS line, as in Markerup's proven Tauri workflow.
          node-version: 24
          cache: npm
          cache-dependency-path: src/client/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix src/client/frontend

      - name: Build frontend
        run: npm run build --prefix src/client/frontend

      - name: Install the locked Tauri CLI
        run: cargo install tauri-cli --version 2.11.0 --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test --workspace --quiet

      - name: Check Rust targets
        run: cargo check --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build and validate client and relay Debian packages
        run: python3 DevUtils/build_debian_packages.py --output target/ci-packages
