<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Pigeon app icon</title>
  <desc id="desc">A stylized white pigeon integrated with a messaging bubble on a blue rounded-square background.</desc>

  <defs>
    <linearGradient id="bg" x1="120" y1="90" x2="900" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8df7"/>
      <stop offset="0.5" stop-color="#2f67c7"/>
      <stop offset="1" stop-color="#1f4c9c"/>
    </linearGradient>
    <linearGradient id="wing" x1="250" y1="420" x2="560" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dbe8ff"/>
      <stop offset="1" stop-color="#7fa7ee"/>
    </linearGradient>
    <linearGradient id="wingShadow" x1="290" y1="500" x2="570" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5c89dc"/>
      <stop offset="1" stop-color="#2a5eb8"/>
    </linearGradient>
    <linearGradient id="beak" x1="700" y1="275" x2="795" y2="355" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9db7e9"/>
      <stop offset="1" stop-color="#5f82c2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0e2e68" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="218" fill="url(#bg)"/>

  <g filter="url(#softShadow)">
    <!-- Main bird / chat-bubble silhouette -->
    <path fill="#ffffff" d="M456 402c44-47 72-109 87-180 13-62 57-110 117-131 71-25 152-2 196 57 35 46 44 108 25 164-9 26-10 47-5 74 6 30 24 59 49 90 42 52 60 116 54 182-8 89-57 166-132 207-63 34-136 43-211 28l-90 70c-13 10-31-1-28-17l15-81c-73-15-138-48-188-95-50-47-82-105-89-165-7-61 13-119 59-161 40-37 88-51 141-42z"/>

    <!-- Neck accent -->
    <path fill="#dce8fb" d="M457 402c62-5 129 7 196 35 73 31 132 76 177 137-36-92-104-161-199-205-61-28-116-40-174-36z"/>

    <!-- Wing shadow/body -->
    <path fill="url(#wingShadow)" d="M174 723c14-130 73-238 166-302 76-52 159-62 218-25 54 34 66 102 35 170-44 96-155 177-272 201-63 13-117 11-147-7z"/>

    <!-- Wing top -->
    <path fill="url(#wing)" d="M201 650c34-96 92-173 172-217 60-33 126-36 174-10 33 18 43 50 30 85-10 27-34 53-70 78-16 11-33 12-48 3-10-6-16-17-18-29-8 17-23 30-41 35-18 5-33 0-44-15-10 20-27 33-47 36-34 5-74-4-108-26z"/>

    <!-- Wing lower edge highlight -->
    <path fill="#6f99e5" opacity="0.7" d="M193 662c55 33 111 41 170 24 93-27 176-89 220-162-35 94-136 187-262 217-62 14-110 12-148-4 3-26 9-51 20-75z"/>

    <!-- Eye -->
    <circle cx="669" cy="240" r="39" fill="#183561"/>
    <circle cx="681" cy="227" r="12" fill="#ffffff"/>

    <!-- Beak -->
    <path fill="url(#beak)" d="M741 268c20-11 39-10 57 2 19 13 34 32 47 58l-91-10c-13-2-21-12-20-25 1-11 3-19 7-25z"/>
    <path fill="#173560" d="M735 310l110 18-97 6c-8 0-13-5-13-13z"/>

    <!-- Message dots -->
    <circle cx="612" cy="660" r="22" fill="#2457aa"/>
    <circle cx="684" cy="660" r="22" fill="#2457aa"/>
    <circle cx="756" cy="660" r="22" fill="#2457aa"/>
  </g>
</svg>
