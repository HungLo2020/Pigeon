<?xml version="1.0" encoding="UTF-8"?>
<!-- Clean vector reconstruction of the pigeon speech-bubble icon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Pigeon speech bubble</title>
  <desc id="desc">A white pigeon with blue wings on a blue rounded-square background.</desc>
  <defs>
    <clipPath id="icon-bounds"><rect width="1254" height="1254" rx="250"/></clipPath>
    <clipPath id="inner-wing-bounds"><rect x="190" y="528" width="490" height="310"/></clipPath>
    <clipPath id="outer-wing-shadow-bounds"><rect x="140" y="530" width="570" height="430"/></clipPath>
    <!-- keeps the outer-wing shadow from bleeding into the collar -->
    <linearGradient id="background" x1="95" y1="88" x2="1160" y2="1180" gradientUnits="userSpaceOnUse"><stop stop-color="#3f72ce"/><stop offset="1" stop-color="#20468f"/></linearGradient>
    <linearGradient id="body" x1="555" y1="205" x2="910" y2="1060" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#eef2fa"/></linearGradient>
    <linearGradient id="outer-wing" x1="285" y1="605" x2="668" y2="890" gradientUnits="userSpaceOnUse"><stop stop-color="#547ec7"/><stop offset="1" stop-color="#31589f"/></linearGradient>
    <linearGradient id="inner-wing" x1="280" y1="535" x2="580" y2="765" gradientUnits="userSpaceOnUse"><stop stop-color="#e6eefc"/><stop offset="1" stop-color="#bdcdea"/></linearGradient>
    <linearGradient id="collar" x1="544" y1="465" x2="985" y2="655" gradientUnits="userSpaceOnUse"><stop stop-color="#d6e1f4"/><stop offset="1" stop-color="#a9bee2"/></linearGradient>
    <linearGradient id="beak-top" x1="885" y1="323" x2="986" y2="385" gradientUnits="userSpaceOnUse"><stop stop-color="#aebfe1"/><stop offset="1" stop-color="#6f89bd"/></linearGradient>
    <filter id="wing-shadow" x="-25%" y="-25%" width="160%" height="165%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/><feOffset in="blur" dx="8" dy="15" result="offset"/><feFlood flood-color="#0d2a66" flood-opacity=".34" result="color"/><feComposite in="color" in2="offset" operator="in"/></filter>
    <filter id="inner-wing-shadow" x="-28%" y="-30%" width="165%" height="175%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/><feOffset in="blur" dx="5" dy="14" result="offset"/><feFlood flood-color="#244985" flood-opacity=".32" result="color"/><feComposite in="color" in2="offset" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#icon-bounds)">
    <!-- blue squircle background -->
    <rect width="1254" height="1254" rx="250" fill="url(#background)"/>
    <!-- speech-bubble body: circular belly extended into a rounded tail -->
    <path id="body-and-tail" fill="url(#body)" d="M508 501C640 477 866 493 1004 651C1069 828 957 1017 758 1027H688L574 1110Q558 1120 561 1099L575 1014C496 1002 430 970 390 933C470 892 497 821 501 745C507 622 507 550 508 501Z"/>
    <!-- head overlaps the body; collar is drawn on top of their overlap -->
    <path id="head" fill="url(#body)" d="M508 501C540 454 553 396 575 326C603 237 665 180 753 179C843 178 910 235 924 317L908 401C905 484 953 543 1004 651C960 601 896 554 833 528C731 486 621 477 508 501Z"/>
    <!-- blue wing shadow and outer wing -->
    <g id="outer-wing-shadow" clip-path="url(#outer-wing-shadow-bounds)"><path filter="url(#wing-shadow)" fill="url(#outer-wing)" d="M507 505C585 498 650 540 669 604C697 699 632 817 537 875C444 932 304 951 171 928C158 925 159 909 162 895C177 811 209 729 253 661C313 568 405 510 507 505Z"/></g>
    <path id="outer-wing-shape" fill="url(#outer-wing)" d="M507 505C585 498 650 540 669 604C697 699 632 817 537 875C444 932 304 951 171 928C158 925 159 909 162 895C177 811 209 729 253 661C313 568 405 510 507 505Z"/>
    <!-- light wing panel and feather lobes -->
    <g id="inner-wing-layer" clip-path="url(#inner-wing-bounds)"><path id="inner-wing-shape" filter="url(#inner-wing-shadow)" fill="url(#inner-wing)" d="M504 528C568 528 626 553 649 601C668 641 659 680 633 708C599 744 550 747 517 718C500 751 467 777 429 781C394 784 371 773 340 753C310 795 271 819 234 813C213 810 202 796 200 776C243 685 297 616 362 574C406 545 454 529 504 528Z"/></g>
    <!-- closed collar sweep above head/body/wing junction -->
    <path id="collar-sweep" fill="url(#collar)" d="M532 460C675 454 844 493 940 575C962 595 979 627 991 666C946 615 871 571 782 543C688 514 599 496 508 501C520 485 528 471 532 460Z"/>
    <!-- eye -->
    <circle id="eye" cx="781" cy="309" r="41" fill="#263757"/><circle id="eye-highlight" cx="791" cy="295" r="14" fill="#fff"/>
    <!-- beak upper and lower planes aligned to head -->
    <path id="beak-upper" fill="url(#beak-top)" d="M875 352C890 322 915 309 937 314C968 324 992 355 999 387C959 381 917 369 875 352Z"/>
    <path id="beak-lower" fill="#26385a" d="M875 352C918 359 960 371 999 387L877 397C873 382 872 367 875 352Z"/>
    <!-- message dots -->
    <g id="message-dots" fill="#274b90"><circle cx="727" cy="809" r="27"/><circle cx="817" cy="809" r="27"/><circle cx="907" cy="809" r="27"/></g>
  </g>
</svg>
